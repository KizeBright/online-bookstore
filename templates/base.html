
<!DOCTYPE html>
<html>
<head>
    <title>Online Bookstore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        nav {
            background: #243b55;
            padding: 15px;
            border-radius: 8px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        h1 {
            color: #243b55;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        input, select {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button, .button {
            background: #1765a8;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .delete {
            background: #c0392b;
        }

        .message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <a href="{{ url_for('books') }}">Books</a>
    <a href="{{ url_for('add_book') }}">Add Book</a>
    <a href="{{ url_for('orders') }}">Orders</a>
    <a href="{{ url_for('add_order') }}">Add Order</a>
</nav>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

{% block content %}{% endblock %}

</body>
</html>
