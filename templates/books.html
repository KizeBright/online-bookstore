
{% extends "base.html" %}

{% block content %}

<h1>Available Books</h1>

<a class="button" href="{{ url_for('add_book') }}">Add New Book</a>

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>₹{{ "%.2f"|format(book.price) }}</td>
        <td>{{ book.stock }}</td>
        <td>
            <a class="button"
               href="{{ url_for('edit_book', book_id=book.id) }}">
               Edit
            </a>

            <form method="POST"
                  action="{{ url_for('delete_book', book_id=book.id) }}"
                  style="display:inline">
                <button class="delete" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
